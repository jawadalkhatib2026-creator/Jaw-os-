name: Build Jaw System

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find the project folder
        id: find
        run: |
          f=$(find . -name settings.gradle -not -path "*/node_modules/*" | head -n 1)
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleRelease -Pvc=${{ github.run_number }} --no-daemon

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.run_number }}
          name: Jaw System ${{ github.run_number }}
          files: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/release/*.apk
